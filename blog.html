<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jardín de Palabras</title>

  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Questrial', sans-serif;
      font-size: 1.25rem;
      overflow: hidden;
    }

    body {
      background: black;
    }

    #bg-gif {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .container {
      display: flex;
      height: 100vh;
      backdrop-filter: brightness(0.9) blur(2px);
    }

    .sidebar {
      width: 280px;
      background: rgba(255,255,255,0.3);
      padding: 1rem;
      overflow-y: auto;
      border-right: 2px solid #ccc;
    }

    .content {
      flex: 1;
      padding: 2rem 3rem;
      overflow-y: auto;
      color: white;
      background: rgba(0,0,0,0.35);
    }

    .top-button {
      display: block;
      margin-bottom: 1rem;
      padding: 0.5rem;
      background: #ffffffcc;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
      margin-bottom: 1rem;
    }

    .entry-title {
      margin: 0.4rem 0;
      padding: 0.4rem;
      border-radius: 6px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
    }

    .entry-title:hover {
      background: rgba(255,255,255,0.3);
    }

    .entry-title.active {
      font-weight: bold;
      background: rgba(255,255,255,0.45);
    }

    .random-btn {
      margin-top: 2rem;
      padding: 0.5rem 1rem;
      background: #ffffffcc;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .mobile-toggle {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 1000;
      background: #333;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
    }

    @media (max-width: 768px) {
      .mobile-toggle {
        display: block;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto auto 0;
        width: 80%;
        height: 100%;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        background: white;
        z-index: 999;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<img src="images/fondojardin.jpg" alt="Fondo jardín" id="bg-gif">

<button class="mobile-toggle" onclick="toggleSidebar()">☰ Menú</button>

<div class="container">

  <aside class="sidebar" id="sidebar">
    <a class="top-button" href="/">⬅ Volver</a>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar...">
    </div>

    <div id="entryList"></div>
  </aside>

  <main class="content" id="contentArea">
    <h2>Bienvenida a mi jardín de palabras 🌼</h2>
    <p>Haz clic en un texto para leerlo aquí.</p>
  </main>

</div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  console.log('blog script arrancando');

  const entries = [
    { title: "Amor y mar", file: "blog/amor-y-mar.html" },
    { title: "A las amigas", file: "blog/alasamigas.html" },
    { title: "Anormal", file: "blog/anormal.html" },
    { title: "Canto del Bodhi", file: "blog/bodhi.html" },
    { title: "No hay mal que por bien no venga", file: "blog/cuento.html" },
    { title: "De las palabras", file: "blog/de-las-palabras.html" },
    { title: "Doler y creer", file: "blog/doler-y-creer.html" },
    { title: "Enfermedad social", file: "blog/enfermedad-social.html" },
    { title: "Insurrección", file: "blog/insurreccion.html" },
    { title: "La mente y el alma", file: "blog/la-mente-y-el-alma.html" },
    { title: "Luna nueva", file: "blog/lunanueva.html" },
    { title: "Psicopolítica", file: "blog/psicopolitica.html" },
    { title: "Psiquedélico", file: "blog/psiquedelico.html" },
    { title: "Redención", file: "blog/redencion.html" },
    { title: "Respirar", file: "blog/respirar.html" },
    { title: "Salud mental", file: "blog/salud-mental.html" },
    { title: "Ser", file: "blog/ser.html" },
    { title: "Transpersonal", file: "blog/transpersonal.html" },
    { title: "Ceiba sagrada", file: "blog/ceiba-sagrada.html" },
    { title: "La vegetariana", file: "blog/vegetariana.html" }
  ];
 const entryList = document.getElementById("entryList");
  const contentArea = document.getElementById("contentArea");
  const searchInput = document.getElementById("searchInput");

  // helpers
  const slugFromFile = file => file.replace(/\.html$/i, '');
  const findBySlug = slug => entries.find(e => slugFromFile(e.file) === slug);

  function renderList(filter = "") {
    entryList.innerHTML = "";
    entries
      .filter(e => e.title.toLowerCase().includes(filter.toLowerCase()))
      .forEach(entry => {
        const div = document.createElement("div");
        div.className = "entry-title";
        div.textContent = entry.title;
        // guardamos slug como atributo para poder copiar enlace o detectar
        const slug = slugFromFile(entry.file);
        div.dataset.slug = slug;

        div.onclick = () => {
          loadEntry(entry, div);
          // actualizamos hash para que la URL sea compartible
          // usamos replaceState/pushState si prefieres no agregar al historial push: history.pushState(null, '', '#' + slug);
          location.hash = slug;
        };

        entryList.appendChild(div);
      });
  }

  async function fetchWithFallback(path) {
    let res = await fetch(path);
    if (!res.ok) {
      // intenta en subcarpeta blog/
      res = await fetch('blog/' + path);
    }
    return res;
  }

  async function loadEntry(entry, el) {
    document.querySelectorAll(".entry-title").forEach(e => e.classList.remove("active"));
    if (el) el.classList.add("active");

    try {
      let res = await fetchWithFallback(entry.file);
      if (!res.ok) {
        contentArea.innerHTML = `<h2>${entry.title}</h2><p>Error al cargar (${res.status})</p>`;
        return;
      }
      const html = await res.text();
      const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
      const content = bodyMatch ? bodyMatch[1] : html;
      contentArea.innerHTML = `<h2>${entry.title}</h2>${content}`;
    } catch (err) {
      console.error('fetch error', err);
      contentArea.innerHTML = `<h2>${entry.title}</h2><p>Error al cargar el contenido.</p>`;
    }
  }

  // carga inicial: si hay hash, intenta mostrar la entrada correspondiente
  function loadFromHash() {
    const hash = location.hash ? location.hash.slice(1) : '';
    if (!hash) return;
    const e = findBySlug(hash);
    if (e) {
      // buscar el elemento visual para marcarlo activo
      const el = entryList.querySelector(`[data-slug="${hash}"]`);
      loadEntry(e, el || null);
    } else {
      console.warn('No se encontró entry para hash:', hash);
    }
  }

  // manejar cambios de hash (atras/adelante o manual)
  window.addEventListener('hashchange', () => {
    loadFromHash();
  });

  if (searchInput) {
    searchInput.addEventListener("input", e => {
      renderList(e.target.value);
    });
  }

  renderList();
  // después de renderizar la lista, intentar cargar desde el hash si existe
  loadFromHash();

  // exponer toggleSidebar
  window.toggleSidebar = function() {
    document.getElementById("sidebar").classList.toggle("open");
  };
});
</script>
</body>
</html>
