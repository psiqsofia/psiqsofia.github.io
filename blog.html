<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jardín de Palabras</title>

  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Questrial', sans-serif;
      font-size: 1.25rem;
      overflow: hidden;
    }

    body {
      background: black;
    }

    #bg-gif {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .container {
      display: flex;
      height: 100vh;
      backdrop-filter: brightness(0.9) blur(2px);
    }

    .sidebar {
      width: 280px;
      background: rgba(255,255,255,0.3);
      padding: 1rem;
      overflow-y: auto;
      border-right: 2px solid #ccc;
    }

    .content {
      flex: 1;
      padding: 2rem 3rem;
      overflow-y: auto;
      color: white;
      background: rgba(0,0,0,0.35);
    }

    .top-button {
      display: block;
      margin-bottom: 1rem;
      padding: 0.5rem;
      background: #ffffffcc;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
      margin-bottom: 1rem;
    }

    .entry-title {
      margin: 0.4rem 0;
      padding: 0.4rem;
      border-radius: 6px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
    }

    .entry-title:hover {
      background: rgba(255,255,255,0.3);
    }

    .entry-title.active {
      font-weight: bold;
      background: rgba(255,255,255,0.45);
    }

    .random-btn {
      margin-top: 2rem;
      padding: 0.5rem 1rem;
      background: #ffffffcc;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .mobile-toggle {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 1000;
      background: #333;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
    }

    @media (max-width: 768px) {
      .mobile-toggle {
        display: block;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto auto 0;
        width: 80%;
        height: 100%;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        background: white;
        z-index: 999;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<img src="images/fondojardin.jpg" alt="Fondo jardín" id="bg-gif">

<button class="mobile-toggle" onclick="toggleSidebar()">☰ Menú</button>

<div class="container">

  <aside class="sidebar" id="sidebar">
    <a class="top-button" href="/">⬅ Volver</a>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar...">
    </div>

    <div id="entryList"></div>
  </aside>

  <main class="content" id="contentArea">
    <h2>Bienvenida a mi jardín de palabras 🌼</h2>
    <p>Haz clic en un texto para leerlo aquí.</p>
  </main>

</div>
window.addEventListener('DOMContentLoaded', () => {
<script>
  const entries = [
    { title: "Amor y mar", file: "amor-y-mar.html" },
    { title: "A las amigas", file: "alasamigas.html" },
    { title: "Anormal", file: "anormal.html" },
    { title: "Canto del Bodhi", file: "bodhi.html" },
    { title: "No hay mal que por bien no venga", file: "cuento.html" },
    { title: "De las palabras", file: "de-las-palabras.html" },
    { title: "Doler y creer", file: "doler-y-creer.html" },
    { title: "Enfermedad social", file: "enfermedad-social.html" },
    { title: "Insurrección", file: "insurreccion.html" },
    { title: "La mente y el alma", file: "la-mente-y-el-alma.html" },
    { title: "Luna nueva", file: "lunanueva.html" },
    { title: "Psicopolítica", file: "psicopolitica.html" },
    { title: "Psiquedélico", file: "psiquedelico.html" },
    { title: "Redención", file: "redencion.html" },
    { title: "Respirar", file: "respirar.html" },
    { title: "Salud mental", file: "salud-mental.html" },
    { title: "Ser", file: "ser.html" },
    { title: "Transpersonal", file: "transpersonal.html" },
    { title: "La vegetariana", file: "vegetariana.html" }
  ];

  const entryList = document.getElementById("entryList");
  const contentArea = document.getElementById("contentArea");
  const searchInput = document.getElementById("searchInput");

  function renderList(filter = "") {
    entryList.innerHTML = "";
    entries
      .filter(e => e.title.toLowerCase().includes(filter.toLowerCase()))
      .forEach(entry => {
        const div = document.createElement("div");
        div.className = "entry-title";
        div.textContent = entry.title;
        div.onclick = () => loadEntry(entry, div);
        entryList.appendChild(div);
      });
  }

  async function loadEntry(entry, el) {
    document.querySelectorAll(".entry-title")
      .forEach(e => e.classList.remove("active"));

    if (el) el.classList.add("active");

    const res = await fetch(entry.file);
    const html = await res.text();

   const bodyMatch = html.match(/<body[^>]>([\s\S])</body>/i);
    const content = bodyMatch ? bodyMatch[1] : html;

    contentArea.innerHTML = `<h2>${entry.title}</h2>${content}`;
  }

  searchInput.addEventListener("input", e => {
    renderList(e.target.value);
  });

  renderList();

  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
  }
</script>
});
</body>
</html>
